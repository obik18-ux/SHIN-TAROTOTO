<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIN-TAROTOTO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 34px;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #555;
    font-size: 17px;
}

.box {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    font-size: 22px;
}

textarea {
    width: 100%;
    min-height: 180px;
    padding: 12px;
    font-size: 15px;
    line-height: 1.6;
    border: 1px solid #bbb;
    border-radius: 7px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 20px;
    margin: 8px 5px 8px 0;
    font-size: 16px;
    cursor: pointer;
    background: #222;
    color: white;
}

button:hover {
    opacity: 0.85;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.status {
    margin-top: 8px;
    font-weight: bold;
    min-height: 24px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

th {
    background: #eee;
}

.team {
    text-align: left;
    font-weight: bold;
    white-space: nowrap;
}

select {
    padding: 7px 12px;
    font-size: 16px;
    border-radius: 5px;
}

.tarot-area {
    overflow-x: auto;
}

.tarot-grid {
    display: grid;
    grid-template-columns: repeat(13, minmax(90px, 1fr));
    gap: 8px;
    min-width: 1250px;
    margin-top: 20px;
}

.tarot-item {
    text-align: center;
    padding: 5px;
}

.tarot-card {
    width: 100%;
    max-width: 105px;
    aspect-ratio: 2 / 3.3;
    object-fit: contain;
    border-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    background: #ddd;
}

.reversed {
    transform: rotate(180deg);
}

.card-number {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 5px;
}

.card-name {
    font-size: 12px;
    font-weight: bold;
    margin-top: 5px;
    min-height: 32px;
}

.card-position {
    font-size: 11px;
    margin-top: 3px;
}

.prediction {
    font-size: 14px;
    font-weight: bold;
    margin-top: 5px;
}

.result {
    font-weight: bold;
    font-size: 16px;
}

.pattern {
    margin: 10px 0;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: #fafafa;
}

.pattern-title {
    font-weight: bold;
    margin-bottom: 7px;
}

.pattern-number {
    font-family: monospace;
    font-size: 20px;
    letter-spacing: 4px;
    font-weight: bold;
}

.note {
    font-size: 14px;
    line-height: 1.7;
    color: #555;
}

@media (max-width: 700px) {

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 27px;
    }

    .box {
        padding: 14px;
    }

    .tarot-grid {
        min-width: 1150px;
    }

    th,
    td {
        font-size: 13px;
        padding: 6px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>SHIN-TAROTOTO</h1>

<div class="subtitle">
13試合予測 WEB版
</div>


<!-- =========================
     13試合データ
========================= -->

<div class="box">

<h2>13試合データ</h2>

<textarea
id="sourceData"
placeholder="スポーツくじの13試合データをここに貼り付けてください。&#10;&#10;例：&#10;1　ホームチーム　VS　アウェーチーム&#10;2　ホームチーム　VS　アウェーチーム"
></textarea>

<br>

<button onclick="extractMatches()">
13試合を抽出
</button>

<div
id="extractStatus"
class="status">
</div>

</div>


<!-- =========================
     13試合
========================= -->

<div class="box">

<h2>13試合</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>No.</th>
<th>ホーム</th>
<th>vs</th>
<th>アウェー</th>
<th>スポーツくじ</th>
<th>totoONE</th>
</tr>

</thead>

<tbody id="matchBody"></tbody>

</table>

</div>

</div>


<!-- =========================
     タロット
========================= -->

<div class="box">

<h2>13枚のタロット</h2>

<button
id="tarotButton"
onclick="drawTarot()">
13枚のタロットを引く
</button>

<button onclick="resetAll()">
リセット
</button>

<div
id="tarotStatus"
class="status">
</div>

<div class="tarot-area">

<div
id="tarotGrid"
class="tarot-grid">
</div>

</div>

</div>


<!-- =========================
     最終予想
========================= -->

<div class="box">

<h2>最終予想</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>No.</th>
<th>ホーム</th>
<th>vs</th>
<th>アウェー</th>
<th>スポーツくじ</th>
<th>totoONE</th>
<th>タロット</th>
<th>最終予想</th>
</tr>

</thead>

<tbody id="resultBody"></tbody>

</table>

</div>

</div>


<!-- =========================
     5パターン
========================= -->

<div class="box">

<h2>5つの購入パターン</h2>

<div id="patterns"></div>

<div class="note">

1＝勝　0＝分　2＝負

</div>

</div>

</div>


<script>

/* =====================================================
   タロット22枚
===================================================== */

const tarotCards = [

{
name:"愚者",
file:"The_Fool_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:2
},

{
name:"魔術師",
file:"The_Magician_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
},

{
name:"女教皇",
file:"The_High_Priestess_(Rider-Waite_Smith_tarot_deck).png",
upright:0,
reversed:2
},

{
name:"女帝",
file:"The_Empress_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
},

{
name:"皇帝",
file:"The_Emperor_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:2
},

{
name:"法王",
file:"The_Hierophant_(Rider-Waite_Smith_tarot_deck).png",
upright:0,
reversed:1
},

{
name:"恋人",
file:"The_Lovers_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
},

{
name:"戦車",
file:"The_Chariot_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:2
},

{
name:"力",
file:"Strength_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
},

{
name:"隠者",
file:"The_Hermit_(Rider-Waite_Smith_tarot_deck).png",
upright:0,
reversed:2
},

{
name:"運命の輪",
file:"Wheel_of_Fortune_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:2
},

{
name:"正義",
file:"Justice_(Rider-Waite_Smith_tarot_deck).png",
upright:0,
reversed:1
},

{
name:"吊るされた男",
file:"The_Hanged_Man_(Rider-Waite_Smith_tarot_deck).png",
upright:0,
reversed:2
},

{
name:"死神",
file:"Death_(Rider-Waite_Smith_tarot_deck).png",
upright:2,
reversed:1
},

{
name:"節制",
file:"Temperance_(Rider-Waite_Smith_tarot_deck).png",
upright:0,
reversed:1
},

{
name:"悪魔",
file:"The_Devil_(Rider-Waite_Smith_tarot_deck).png",
upright:2,
reversed:0
},

{
name:"塔",
file:"The_Tower_(Rider-Waite_Smith_tarot_deck).png",
upright:2,
reversed:0
},

{
name:"星",
file:"The_Star_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
},

{
name:"月",
file:"The_Moon_(Rider-Waite_Smith_tarot_deck).png",
upright:2,
reversed:0
},

{
name:"太陽",
file:"The_Sun_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
},

{
name:"審判",
file:"Judgement_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:2
},

{
name:"世界",
file:"The_World_(Rider-Waite_Smith_tarot_deck).png",
upright:1,
reversed:0
}

];


/* =====================================================
   データ
===================================================== */

let matches = [];

let tarotResults = [];

let finalResults = [];


/* =====================================================
   チーム名整理
===================================================== */

function cleanTeamName(name){

    return String(name || "")
        .replace(/データ/g,"")
        .replace(/\t/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =====================================================
   試合1行を解析
===================================================== */

function parseMatchLine(line){

    if(!line){
        return null;
    }

    let s = line.trim();

    if(!s){
        return null;
    }

    s = s.replace(/ＶＳ/g,"VS");
    s = s.replace(/ｖｓ/g,"VS");
    s = s.replace(/\bvs\b/gi,"VS");

    if(!s.includes("VS")){
        return null;
    }

    const parts = s.split("VS");

    if(parts.length < 2){
        return null;
    }

    let left = parts[0].trim();

    let right =
        parts.slice(1).join("VS").trim();

    /*
       先頭の試合番号を削除
    */

    left =
        left.replace(
            /^\s*\d+\s*/,
            ""
        );

    /*
       日付・時刻を削除
    */

    left =
        left.replace(
            /^\d{1,2}\/\d{1,2}\s*/,
            ""
        );

    left =
        left.replace(
            /^\d{1,2}:\d{2}\s*/,
            ""
        );

    /*
       右側の「データ」等を削除
    */

    right =
        right.replace(
            /データ.*$/g,
            ""
        );

    left = cleanTeamName(left);

    right = cleanTeamName(right);

    if(!left || !right){
        return null;
    }

    return {
        home:left,
        away:right
    };

}


/* =====================================================
   13試合抽出
===================================================== */

function extractMatches(){

    const source =
        document.getElementById(
            "sourceData"
        ).value;

    const status =
        document.getElementById(
            "extractStatus"
        );

    matches = [];

    if(!source.trim()){

        status.textContent =
            "試合データを貼り付けてください。";

        return;
    }

    const lines =
        source.split(/\r?\n/);

    for(const line of lines){

        if(matches.length >= 13){
            break;
        }

        const match =
            parseMatchLine(line);

        if(match){
            matches.push(match);
        }

    }

    if(matches.length !== 13){

        status.textContent =
            matches.length +
            "試合を抽出しました。13試合あるか確認してください。";

    }else{

        status.textContent =
            "13試合を抽出しました。";

    }

    renderMatches();

}


/* =====================================================
   試合表示
===================================================== */

function renderMatches(){

    const body =
        document.getElementById(
            "matchBody"
        );

    body.innerHTML = "";

    matches.forEach(
        (match,index)=>{

            const tr =
                document.createElement("tr");

            tr.innerHTML = `

<td>${index+1}</td>

<td class="team">
${escapeHTML(match.home)}
</td>

<td>vs</td>

<td class="team">
${escapeHTML(match.away)}
</td>

<td>

<select id="sports-${index}">

<option value="">---</option>

<option value="1">1</option>

<option value="0">0</option>

<option value="2">2</option>

</select>

</td>

<td>

<select id="toto-${index}">

<option value="">---</option>

<option value="1">1</option>

<option value="0">0</option>

<option value="2">2</option>

</select>

</td>

`;

            body.appendChild(tr);

        }
    );

}


/* =====================================================
   タロット画像URL
===================================================== */

function tarotImage(card){

    return (
        "https://commons.wikimedia.org/wiki/Special:FilePath/"
        +
        encodeURIComponent(card.file)
        +
        "?width=300"
    );

}


/* =====================================================
   タロットを引く
===================================================== */

function drawTarot(){

    if(matches.length !== 13){

        alert(
            "先に13試合を抽出してください。"
        );

        return;
    }

    /*
       入力値を保存
    */

    matches.forEach(
        (match,index)=>{

            match.sports =
                document.getElementById(
                    "sports-"+index
                ).value;

            match.toto =
                document.getElementById(
                    "toto-"+index
                ).value;

        }
    );


    const button =
        document.getElementById(
            "tarotButton"
        );

    button.disabled = true;


    const status =
        document.getElementById(
            "tarotStatus"
        );

    status.textContent =
        "13枚のタロットを引いています……";


    tarotResults = [];


    /*
       22枚から13枚を重複なしで選ぶ
    */

    const selected = [];

    while(selected.length < 13){

        const n =
            Math.floor(
                Math.random()
                * tarotCards.length
            );

        if(!selected.includes(n)){

            selected.push(n);

        }

    }


    /*
       13枚決定
    */

    for(let i=0;i<13;i++){

        const card =
            tarotCards[selected[i]];

        const reversed =
            Math.random() < 0.5;


        const prediction =
            reversed
            ? card.reversed
            : card.upright;


        tarotResults.push({

            card:card,

            reversed:reversed,

            prediction:prediction

        });

    }


    renderTarot();

    renderResults();

    createPatterns();


    status.textContent =
        "13枚のタロットが決まりました。";


    button.disabled = false;

}


/* =====================================================
   タロット13枚表示
===================================================== */

function renderTarot(){

    const grid =
        document.getElementById(
            "tarotGrid"
        );

    grid.innerHTML = "";


    tarotResults.forEach(
        (item,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "tarot-item";


            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "tarot-card";


            if(item.reversed){

                img.classList.add(
                    "reversed"
                );

            }


            img.src =
                tarotImage(
                    item.card
                );

            img.alt =
                item.card.name;


            img.onerror =
                function(){

                    this.style.display =
                        "none";

                };


            div.innerHTML = `

<div class="card-number">
第${index+1}試合
</div>

`;


            div.appendChild(img);


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "card-name";

            name.textContent =
                item.card.name;

            div.appendChild(name);


            const position =
                document.createElement(
                    "div"
                );

            position.className =
                "card-position";

            position.textContent =
                item.reversed
                ? "逆位置"
                : "正位置";

            div.appendChild(position);


            const prediction =
                document.createElement(
                    "div"
                );

            prediction.className =
                "prediction";


            if(item.prediction === 1){

                prediction.textContent =
                    "勝（1）";

            }
            else if(
                item.prediction === 2
            ){

                prediction.textContent =
                    "負（2）";

            }
            else{

                prediction.textContent =
                    "分（0）";

            }


            div.appendChild(prediction);


            grid.appendChild(div);

        }
    );

}


/* =====================================================
   最終予想
===================================================== */

function renderResults(){

    const body =
        document.getElementById(
            "resultBody"
        );

    body.innerHTML = "";

    finalResults = [];


    matches.forEach(
        (match,index)=>{

            const tarot =
                tarotResults[index];


            let finalPrediction =
                tarot.prediction;


            /*
               スポーツくじとtotoONEが
               同じ数字なら、その数字を採用。

               異なる場合はタロット。
            */

            if(
                match.sports !== "" &&
                match.toto !== "" &&
                match.sports === match.toto
            ){

                finalPrediction =
                    Number(match.sports);

            }


            finalResults.push(
                finalPrediction
            );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

<td>
${index+1}
</td>

<td class="team">
${escapeHTML(match.home)}
</td>

<td>
vs
</td>

<td class="team">
${escapeHTML(match.away)}
</td>

<td>
${match.sports || "---"}
</td>

<td>
${match.toto || "---"}
</td>

<td>
${resultText(tarot.prediction)}
</td>

<td class="result">
${resultText(finalPrediction)}
</td>

`;


            body.appendChild(tr);

        }
    );

}


/* =====================================================
   5つの購入パターン
===================================================== */

function createPatterns(){

    const area =
        document.getElementById(
            "patterns"
        );

    area.innerHTML = "";


    if(finalResults.length !== 13){
        return;
    }


    const patterns = [];


    /*
       パターン1
       最終予想
    */

    patterns.push(
        finalResults.slice()
    );


    /*
       パターン2
       タロット
    */

    patterns.push(
        tarotResults.map(
            x => x.prediction
        )
    );


    /*
       パターン3
       スポーツくじ優先
    */

    patterns.push(
        matches.map(
            (x,i)=>
                x.sports !== ""
                ? Number(x.sports)
                : finalResults[i]
        )
    );


    /*
       パターン4
       totoONE優先
    */

    patterns.push(
        matches.map(
            (x,i)=>
                x.toto !== ""
                ? Number(x.toto)
                : finalResults[i]
        )
    );


    /*
       パターン5
       ミックス
    */

    patterns.push(
        makeMixedPattern()
    );


    patterns.forEach(
        (pattern,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "pattern";


            div.innerHTML = `

<div class="pattern-title">
パターン${index+1}
</div>

<div class="pattern-number">
${pattern.join(" ")}
</div>

`;


            area.appendChild(div);

        }
    );

}


/* =====================================================
   ミックスパターン
===================================================== */

function makeMixedPattern(){

    return matches.map(
        (match,index)=>{

            if(
                match.sports !== "" &&
                match.toto !== ""
            ){

                if(
                    match.sports ===
                    match.toto
                ){

                    return Number(
                        match.sports
                    );

                }

                return tarotResults[
                    index
                ].prediction;

            }


            if(match.sports !== ""){

                return Number(
                    match.sports
                );

            }


            if(match.toto !== ""){

                return Number(
                    match.toto
                );

            }


            return tarotResults[
                index
            ].prediction;

        }
    );

}


/* =====================================================
   結果表示
===================================================== */

function resultText(value){

    if(Number(value) === 1){
        return "勝（1）";
    }

    if(Number(value) === 0){
        return "分（0）";
    }

    if(Number(value) === 2){
        return "負（2）";
    }

    return "---";

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   リセット
===================================================== */

function resetAll(){

    matches = [];

    tarotResults = [];

    finalResults = [];


    document.getElementById(
        "sourceData"
    ).value = "";


    document.getElementById(
        "matchBody"
    ).innerHTML = "";


    document.getElementById(
        "tarotGrid"
    ).innerHTML = "";


    document.getElementById(
        "resultBody"
    ).innerHTML = "";


    document.getElementById(
        "patterns"
    ).innerHTML = "";


    document.getElementById(
        "extractStatus"
    ).textContent = "";


    document.getElementById(
        "tarotStatus"
    ).textContent = "";

}

</script>

</body>
</html>
