<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIN-TAROTOTO 13試合予測</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Yu Gothic",
        "Meiryo",
        Arial,
        sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

header {
    text-align: center;
    background: #111827;
    color: white;
    padding: 25px 15px;
    border-radius: 14px;
    margin-bottom: 20px;
}

header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 1px;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.notice {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.notice strong {
    font-size: 18px;
}

.match {
    background: white;
    border-radius: 12px;
    margin-bottom: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.match-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

label {
    font-size: 13px;
    color: #555;
    display: block;
    margin-bottom: 5px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.section-title {
    margin: 28px 0 12px;
    font-size: 22px;
    font-weight: bold;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

#predictButton {
    background: #111827;
    color: white;
}

#resetButton {
    background: #6b7280;
    color: white;
}

button:hover {
    opacity: 0.9;
}

#resultArea {
    display: none;
    margin-top: 30px;
}

.result-card {
    background: white;
    border-radius: 12px;
    margin-bottom: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.result-number {
    font-weight: bold;
    font-size: 17px;
}

.teams {
    margin: 8px 0;
    font-size: 16px;
}

.prediction {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 20px;
    background: #111827;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.confidence {
    margin-top: 8px;
    font-size: 14px;
    color: #555;
}

.summary {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.summary h3 {
    margin-top: 0;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #eee;
}

.summary-row:last-child {
    border-bottom: none;
}

footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin: 30px 0 10px;
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    header h1 {
        font-size: 25px;
    }

    .inputs {
        grid-template-columns: 1fr;
    }

    .match {
        padding: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>SHIN-TAROTOTO</h1>
    <p>13試合 予測WEB版</p>
</header>

<div class="notice">
    <strong>13試合を入力してください。</strong>
    <p>
        ホームチームとアウェイチームを入力し、
        必要に応じて各チームの情報を入力してください。
    </p>
</div>

<div id="matches"></div>

<button id="predictButton" onclick="predictAll()">
    13試合を予測する
</button>

<button id="resetButton" onclick="resetAll()">
    入力をリセット
</button>

<div id="resultArea">

    <div class="section-title">
        予測結果
    </div>

    <div id="results"></div>

    <div class="summary">
        <h3>13試合の集計</h3>

        <div class="summary-row">
            <span>ホーム勝ち</span>
            <strong id="homeCount">0</strong>
        </div>

        <div class="summary-row">
            <span>引き分け</span>
            <strong id="drawCount">0</strong>
        </div>

        <div class="summary-row">
            <span>アウェイ勝ち</span>
            <strong id="awayCount">0</strong>
        </div>
    </div>

</div>

<footer>
    SHIN-TAROTOTO
</footer>

</div>

<script>

const MATCH_COUNT = 13;


/* ========================================
   13試合の入力欄を作成
======================================== */

function createMatches() {

    const area = document.getElementById("matches");

    area.innerHTML = "";

    for (let i = 1; i <= MATCH_COUNT; i++) {

        const div = document.createElement("div");

        div.className = "match";

        div.innerHTML = `

            <div class="match-title">
                第${i}試合
            </div>

            <div class="inputs">

                <div>
                    <label>ホームチーム</label>
                    <input
                        type="text"
                        id="home${i}"
                        placeholder="ホームチーム"
                    >
                </div>

                <div>
                    <label>アウェイチーム</label>
                    <input
                        type="text"
                        id="away${i}"
                        placeholder="アウェイチーム"
                    >
                </div>

            </div>

        `;

        area.appendChild(div);
    }
}


/* ========================================
   簡易予測
======================================== */

function calculatePrediction(home, away, matchNo) {

    /*
       チーム名から一定の数値を作る。
       同じチーム名なら同じ傾向になるようにする。
    */

    function teamValue(name) {

        let value = 0;

        for (let i = 0; i < name.length; i++) {

            value += name.charCodeAt(i) * (i + 1);

        }

        return value;
    }


    const homeValue = teamValue(home);
    const awayValue = teamValue(away);


    /*
       ホームアドバンテージ
    */

    const homeScore =
        (homeValue % 100) + 15;


    const awayScore =
        (awayValue % 100);


    const difference =
        homeScore - awayScore;


    let prediction;
    let confidence;


    if (difference >= 25) {

        prediction = "1";
        confidence = "高";

    }
    else if (difference >= 8) {

        prediction = "1";
        confidence = "中";

    }
    else if (difference <= -25) {

        prediction = "2";
        confidence = "高";

    }
    else if (difference <= -8) {

        prediction = "2";
        confidence = "中";

    }
    else {

        prediction = "0";
        confidence = "中";

    }


    return {
        prediction: prediction,
        confidence: confidence
    };
}


/* ========================================
   13試合を予測
======================================== */

function predictAll() {

    const resultsArea =
        document.getElementById("results");

    resultsArea.innerHTML = "";


    let homeCount = 0;
    let drawCount = 0;
    let awayCount = 0;


    for (let i = 1; i <= MATCH_COUNT; i++) {

        const home =
            document.getElementById("home" + i).value.trim();

        const away =
            document.getElementById("away" + i).value.trim();


        if (home === "" || away === "") {

            alert(
                "第" + i +
                "試合のホームチームとアウェイチームを入力してください。"
            );

            document.getElementById(
                home === "" ? "home" + i : "away" + i
            ).focus();

            return;
        }


        const result =
            calculatePrediction(home, away, i);


        if (result.prediction === "1") {
            homeCount++;
        }
        else if (result.prediction === "0") {
            drawCount++;
        }
        else {
            awayCount++;
        }


        let predictionText;


        if (result.prediction === "1") {

            predictionText =
                "1　ホーム勝ち";

        }
        else if (result.prediction === "0") {

            predictionText =
                "0　引き分け";

        }
        else {

            predictionText =
                "2　アウェイ勝ち";

        }


        const div =
            document.createElement("div");

        div.className =
            "result-card";


        div.innerHTML = `

            <div class="result-number">
                第${i}試合
            </div>

            <div class="teams">
                ${escapeHtml(home)}
               　vs　
                ${escapeHtml(away)}
            </div>

            <div class="prediction">
                ${predictionText}
            </div>

            <div class="confidence">
                信頼度：${result.confidence}
            </div>

        `;


        resultsArea.appendChild(div);
    }


    document.getElementById("homeCount").textContent =
        homeCount;

    document.getElementById("drawCount").textContent =
        drawCount;

    document.getElementById("awayCount").textContent =
        awayCount;


    document.getElementById("resultArea").style.display =
        "block";


    window.scrollTo({
        top: document.getElementById("resultArea").offsetTop - 20,
        behavior: "smooth"
    });

}


/* ========================================
   HTMLエスケープ
======================================== */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ========================================
   リセット
======================================== */

function resetAll() {

    if (!confirm("入力した内容をすべて消しますか？")) {
        return;
    }


    for (let i = 1; i <= MATCH_COUNT; i++) {

        document.getElementById(
            "home" + i
        ).value = "";

        document.getElementById(
            "away" + i
        ).value = "";

    }


    document.getElementById(
        "results"
    ).innerHTML = "";

    document.getElementById(
        "resultArea"
    ).style.display = "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ========================================
   起動
======================================== */

createMatches();

</script>

</body>
</html>
